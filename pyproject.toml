[project]
name = "sub-image-classifier"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "babaOfPersia", email = "kb267@st-andrews.ac.uk" }
]
requires-python = ">=3.10"
dependencies = [
    "imagesize>=1.4.1",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.7",
    "numpy>=2.0.0",
    "pandas>=2.3.3",
    "polyhood",
    "torch>=2.9.0",
    "tqdm>=4.67.1",
    "ultralytics>=8.3.227",
    "xformers>=0.0.33.post1",
    "zarr>=2.18.3",
]

[project.scripts]
sub-image-classifier = "sub_image_classifier:main"

[build-system]
requires = ["uv_build>=0.9.8,<0.10.0"]
build-backend = "uv_build"

[tool.uv.sources]
polyhood = { path = "dist/polyhood-0.1.0-py3-none-any.whl" }
